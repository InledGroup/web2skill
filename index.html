<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web2Skill</title>
    <style>
      :root {
        /* W2S Logo Inspired Theme (Default) */
        --w2s-bg: #000000;
        --w2s-header: #0a0a0a;
        --w2s-text: #ffffff;
        --w2s-text-muted: #888888;
        --w2s-accent: #ffffff;
        --w2s-border: #333333;
        --w2s-radius: 0px; /* Blocky/Pixel style */
        --w2s-font-header: 'Courier New', Courier, monospace;
        --w2s-font-body: 'Courier New', Courier, monospace;

        /* Light Theme */
        --light-bg: #ffffff;
        --light-header: #f8fafc;
        --light-text: #0f172a;
        --light-text-muted: #64748b;
        --light-accent: #000000;
        --light-border: #e2e8f0;
        --light-radius: 4px;
        --light-font-header: system-ui, sans-serif;
        --light-font-body: system-ui, sans-serif;

        /* Active Vars */
        --bg: var(--w2s-bg);
        --header-bg: var(--w2s-header);
        --text: var(--w2s-text);
        --text-muted: var(--w2s-text-muted);
        --accent: var(--w2s-accent);
        --border: var(--w2s-border);
        --radius: var(--w2s-radius);
        --font-header: var(--w2s-font-header);
        --font-body: var(--w2s-font-body);
      }

      body.light-theme {
        --bg: var(--light-bg);
        --header-bg: var(--light-header);
        --text: var(--light-text);
        --text-muted: var(--light-text-muted);
        --accent: var(--light-accent);
        --border: var(--light-border);
        --radius: var(--light-radius);
        --font-header: var(--light-font-header);
        --font-body: var(--light-font-body);
      }

      body {
        width: 380px;
        font-family: var(--font-body);
        padding: 0;
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        transition: background-color 0.2s;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        background-color: var(--header-bg);
        border-bottom: 2px solid var(--border);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header img {
        width: 28px;
        height: 28px;
        image-rendering: pixelated;
      }

      .header h3 {
        margin: 0;
        font-family: var(--font-header);
        font-size: 18px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      #theme-toggle {
        font-size: 9px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        padding: 4px 8px;
        cursor: pointer;
        text-transform: uppercase;
      }

      .content {
        padding: 16px;
      }

      #status {
        font-size: 12px;
        margin: 0 0 14px 0;
        color: var(--text);
        border-left: 3px solid var(--accent);
        padding-left: 10px;
      }

      #link-list {
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid var(--border);
        margin-bottom: 16px;
        padding: 4px;
        background: rgba(255, 255, 255, 0.03);
      }

      .link-item {
        display: flex;
        align-items: center;
        padding: 8px 10px;
        font-size: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .link-item:last-child {
        border-bottom: none;
      }
      .link-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      body.light-theme .link-item:hover {
        background: #f1f5f9;
      }

      .link-item input {
        margin-right: 12px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .progress-container {
        display: none;
        margin-bottom: 16px;
        padding: 12px;
        border: 1px solid var(--border);
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background-color: var(--border);
        overflow: hidden;
      }

      #progress-fill {
        width: 0%;
        height: 100%;
        background-color: var(--accent);
      }

      #progress-text {
        font-size: 10px;
        text-align: center;
        margin-top: 8px;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      button.main-btn {
        width: 100%;
        padding: 12px;
        border: 2px solid var(--accent);
        background: transparent;
        color: var(--accent);
        font-family: var(--font-header);
        font-size: 13px;
        font-weight: 900;
        cursor: pointer;
        text-transform: uppercase;
      }

      button.main-btn:hover:not(:disabled) {
        background: var(--accent);
        color: var(--bg);
      }

      #manual-btn {
        border-color: var(--text-muted);
        color: var(--text-muted);
      }
      #manual-btn:hover:not(:disabled) {
        border-color: var(--text);
        color: var(--text);
        background: rgba(255, 255, 255, 0.1);
      }

      button:disabled {
        opacity: 0.2;
        cursor: not-allowed;
      }

      .footer {
        padding: 12px;
        font-size: 10px;
        text-align: center;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
      }
      .footer a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid var(--text-muted);
      }

      #selection-banner {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--accent);
        color: var(--bg);
        padding: 12px;
        text-align: center;
        font-size: 12px;
        font-weight: 900;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <img src="w2s.png" alt="W2S">
        <h3>WEB2SKILL</h3>
      </div>
      <button id="theme-toggle">LIGHT_MODE</button>
    </div>
    
    <div class="content">
      <p id="status">SCANNING_DOCS...</p>
      
      <div id="link-list"></div>
      
      <div class="progress-container" id="progress-container">
        <div class="progress-bar">
          <div id="progress-fill"></div>
        </div>
        <p id="progress-text">0%</p>
      </div>

      <div class="actions">
        <button id="export-btn" class="main-btn" disabled>EXPORT_ZIP</button>
        <button id="manual-btn" class="main-btn">SELECT_MANUALLY</button>
      </div>
    </div>

    <div class="footer">
      BY <a href="https://inled.es" target="_blank">INLED GROUP</a> | V1.0
    </div>

    <div id="selection-banner">
      SELECT TARGET ELEMENT
    </div>

    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
