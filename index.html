<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web2Skill</title>
    <style>
      body {
        width: 350px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 15px;
        margin: 0;
        background-color: #f8f9fa;
      }
      h3 {
        margin-top: 0;
        color: #343a40;
        border-bottom: 2px solid #007bff;
        padding-bottom: 5px;
      }
      p {
        font-size: 14px;
        color: #6c757d;
        margin: 10px 0;
      }
      #link-list {
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #dee2e6;
        background-color: white;
        margin: 10px 0;
        padding: 8px;
        border-radius: 4px;
      }
      .link-item {
        display: flex;
        align-items: center;
        margin-bottom: 8px;
        font-size: 13px;
      }
      .link-item input {
        margin-right: 12px;
        cursor: pointer;
      }
      .link-item label {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .progress-container {
        display: none;
        margin: 15px 0;
      }
      .progress-bar {
        width: 100%;
        height: 12px;
        background-color: #e9ecef;
        border-radius: 6px;
        overflow: hidden;
      }
      #progress-fill {
        width: 0%;
        height: 100%;
        background-color: #28a745;
        transition: width 0.3s;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.2s;
      }
      #export-btn {
        background-color: #007bff;
        color: white;
      }
      #export-btn:hover:not(:disabled) {
        background-color: #0056b3;
      }
      #manual-btn {
        background-color: #6c757d;
        color: white;
      }
      #manual-btn:hover:not(:disabled) {
        background-color: #5a6268;
      }
      button:disabled {
        background-color: #ced4da;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h3>Web2Skill</h3>
    <p id="status">Detectando índice...</p>
    
    <div id="link-list"></div>
    
    <div class="progress-container" id="progress-container">
      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
      <p id="progress-text" style="font-size: 11px; text-align: center; margin-top: 5px;">0%</p>
    </div>

    <div class="actions">
      <button id="export-btn" disabled>Exportar Seleccionados</button>
      <button id="manual-btn">Selección Manual</button>
    </div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
