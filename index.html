<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web2Skill</title>
    <style>
      :root {
        /* W2S Logo Inspired Theme (Default Terminal) */
        --terminal-bg: #000000;
        --terminal-header: #0a0a0a;
        --terminal-text: #ffffff;
        --terminal-text-muted: #888888;
        --terminal-accent: #ffffff;
        --terminal-border: #333333;
        --terminal-radius: 0px;
        --terminal-font-header: 'Courier New', Courier, monospace;
        --terminal-font-body: 'Courier New', Courier, monospace;

        /* First Commit Style (Light Theme) */
        --light-bg: #ffffff;
        --light-header: #f8fafc;
        --light-text: #1e293b;
        --light-text-muted: #64748b;
        --light-accent: #2563eb;
        --light-border: #e2e8f0;
        --light-radius: 8px;
        --light-font-header: 'Inter', system-ui, sans-serif;
        --light-font-body: 'Inter', system-ui, sans-serif;

        /* Active Vars */
        --bg: var(--terminal-bg);
        --header-bg: var(--terminal-header);
        --text: var(--terminal-text);
        --text-muted: var(--terminal-text-muted);
        --accent: var(--terminal-accent);
        --border: var(--terminal-border);
        --radius: var(--terminal-radius);
        --font-header: var(--terminal-font-header);
        --font-body: var(--terminal-font-body);
      }

      body.light-theme {
        --bg: var(--light-bg);
        --header-bg: var(--light-header);
        --text: var(--light-text);
        --text-muted: var(--light-text-muted);
        --accent: var(--light-accent);
        --border: var(--light-border);
        --radius: var(--light-radius);
        --font-header: var(--light-font-header);
        --font-body: var(--light-font-body);
      }

      body {
        width: 380px;
        font-family: var(--font-body);
        padding: 0;
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        transition: background-color 0.2s;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        background-color: var(--header-bg);
        border-bottom: 2px solid var(--border);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header img {
        width: 28px;
        height: 28px;
        image-rendering: pixelated;
      }

      .header h3 {
        margin: 0;
        font-family: var(--font-header);
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.5px;
      }

      #theme-toggle {
        font-size: 10px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        padding: 5px 10px;
        cursor: pointer;
        border-radius: var(--radius);
        font-family: var(--font-body);
      }

      .content {
        padding: 16px;
      }

      #status {
        font-size: 13px;
        margin: 0 0 14px 0;
        color: var(--text);
        border-left: 3px solid var(--accent);
        padding-left: 10px;
      }

      #link-list {
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid var(--border);
        margin-bottom: 16px;
        padding: 4px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: var(--radius);
      }

      body.light-theme #link-list {
        background: #ffffff;
      }

      .link-item {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        font-size: 13px;
        border-radius: 4px;
        margin-bottom: 2px;
      }
      .link-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      body.light-theme .link-item:hover {
        background: #f1f5f9;
      }

      .link-item input {
        margin-right: 12px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .progress-container {
        display: none;
        margin-bottom: 16px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: rgba(255,255,255,0.02);
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background-color: var(--border);
        overflow: hidden;
        border-radius: 3px;
      }

      #progress-fill {
        width: 0%;
        height: 100%;
        background-color: var(--accent);
      }

      #progress-text {
        font-size: 11px;
        text-align: center;
        margin-top: 8px;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      button.main-btn {
        width: 100%;
        padding: 12px;
        border: 2px solid var(--accent);
        background: transparent;
        color: var(--accent);
        font-family: var(--font-header);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        border-radius: var(--radius);
        transition: all 0.2s;
      }

      button.main-btn:hover:not(:disabled) {
        background: var(--accent);
        color: var(--bg);
      }

      #export-btn {
        background: var(--accent);
        color: var(--bg);
      }
      #export-btn:hover:not(:disabled) {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      #manual-btn {
        background: transparent;
        border-color: var(--text-muted);
        color: var(--text-muted);
      }
      #manual-btn:hover:not(:disabled) {
        border-color: var(--text);
        color: var(--text);
        background: rgba(255, 255, 255, 0.05);
      }
      body.light-theme #manual-btn:hover:not(:disabled) {
        background: #f8fafc;
        border-color: #cbd5e1;
      }

      button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .footer {
        padding: 12px;
        font-size: 11px;
        text-align: center;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
      }
      .footer a {
        color: var(--accent);
        text-decoration: none;
      }

      #selection-banner {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--accent);
        color: var(--bg);
        padding: 12px;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        z-index: 100;
        font-family: var(--font-body);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <img src="w2s.png" alt="W2S">
        <h3>Web2Skill</h3>
      </div>
      <button id="theme-toggle">Light Mode</button>
    </div>
    
    <div class="content">
      <p id="status">Scanning documentation...</p>
      
      <div id="link-list"></div>
      
      <div class="progress-container" id="progress-container">
        <div class="progress-bar">
          <div id="progress-fill"></div>
        </div>
        <p id="progress-text">0%</p>
      </div>

      <div class="actions">
        <button id="export-btn" class="main-btn" disabled>Export Selection</button>
        <button id="cancel-btn" class="main-btn" style="display: none; border-color: #ef4444; color: #ef4444;">Cancel Export</button>
        <button id="manual-btn" class="main-btn">Manual Selection</button>
      </div>
    </div>

    <div class="footer">
      From <a href="https://inled.es" target="_blank">Inled Group</a>
    </div>

    <div id="selection-banner">
      CLICK TO SELECT NAVIGATION ELEMENT
    </div>

    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
